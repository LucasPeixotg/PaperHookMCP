name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The default Linux torch wheel pulls several GB of CUDA libraries. uv
      # installs get the CPU-only build from [tool.uv.sources] in pyproject.toml,
      # but pip ignores that, so torch is installed from the CPU index first.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # paperhook/services/models/reranker.py builds the CrossEncoder at import time,
      # so importing it in tests/test_reranker.py downloads the weights even
      # though every test then stubs the model out.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cross-encoder-ms-marco-MiniLM-L-6-v2

      - name: Run tests
        run: pytest
